# 일일 배치를 Mac(launchd) 대신 GitHub Actions 에서 돌립니다(2026-11).
# Mac 이 꺼지거나 잠들면 배치가 통째로 멈추던 문제(2026-11-14~) 때문입니다.
#
# 시간은 Mac 시절과 같습니다(cron 은 UTC 기준, GitHub 사정으로 수십 분 늦게 시작할 수 있음).
#   평일 18:30 KST  국내 증분  (--kr)
#   평일 07:00 KST  해외 증분  (--us)
#   토요일 09:00 KST 전체 전량 (--full)
# 저장소 Settings → Secrets and variables → Actions 에 아래 4개가 있어야 합니다.
#   KIS_APP_KEY, KIS_APP_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: 일일 배치

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 월~금 18:30 KST
    - cron: "0 22 * * 0-4"   # 월~금 07:00 KST (UTC 로는 일~목 22:00)
    - cron: "0 0 * * 6"      # 토 09:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: "수집 범위"
        type: choice
        options: [kr, us, full]
        default: kr

# 같은 배치가 겹쳐 돌지 않게 합니다(앞 실행이 끝날 때까지 대기)
concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # 배치는 날짜·시각을 한국 시간으로 계산합니다(해외 미완성 봉 판정 등)
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: batch/requirements.txt
      - run: pip install -r batch/requirements.txt
      - name: 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 9 * * 1-5" ]; then
            echo "mode=kr" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 22 * * 0-4" ]; then
            echo "mode=us" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
      - name: 배치 실행 (--${{ steps.mode.outputs.mode }})
        working-directory: batch
        run: python run.py --${{ steps.mode.outputs.mode }}
